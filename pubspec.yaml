name: logitrack
description: Application de location de voiture et envoi de colis
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^16.3.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0
  table_calendar: ^3.1.1
  dotted_border: ^2.1.0
  badges: ^3.1.2
  pin_code_fields: ^8.0.1
  smooth_page_indicator: ^1.1.0

  # Utilitaires
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  qr_flutter: ^4.1.0
  barcode_scan2: ^4.2.4
  timeline_tile: ^2.0.0
  flutter_slidable: ^3.1.0
  pdf: ^3.10.8
  printing: ^5.12.0
  open_file: ^3.3.2
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true