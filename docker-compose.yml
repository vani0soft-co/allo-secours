version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: allo-secours-mongo
    environment:
      MONGO_INITDB_DATABASE: allo-secours
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - allo-secours-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Express Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allo-secours-backend
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/allo-secours
      JWT_SECRET: your_jwt_secret_key_change_in_production
      JWT_EXPIRY: 7d
      API_VERSION: v1
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    networks:
      - allo-secours-network
    command: npm run dev
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  allo-secours-network:
    driver: bridge
